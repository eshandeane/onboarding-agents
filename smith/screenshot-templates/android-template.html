<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 411px;
        height: 823px;
        background: BACKGROUND_COLOR;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      .title {
        color: white;
        font-size: 36px;
        font-weight: 700;
        text-align: center;
        padding: 30px 30px 15px;
        line-height: 1.2;
      }
      .phone-container {
        position: relative;
        width: 300px;
        flex: 1;
        display: flex;
        justify-content: center;
      }
      .phone-frame {
        position: relative;
        width: 280px;
        height: 570px;
        border: 4px solid #888;
        border-radius: 30px;
        background: #000;
        padding: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      }
      .phone-frame::before {
        content: "";
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 80px;
        height: 4px;
        background: #555;
        border-radius: 2px;
      }
      .phone-frame::after {
        content: "";
        position: absolute;
        top: 6px;
        left: 30%;
        width: 6px;
        height: 6px;
        background: #333;
        border-radius: 50%;
      }
      .screen {
        width: 100%;
        height: 100%;
        border-radius: 22px;
        overflow: hidden;
        background: white;
      }
      .screen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
    </style>
  </head>
  <body>
    <div class="title">TITLE_TEXT</div>
    <div class="phone-container">
      <div class="phone-frame">
        <div class="screen">
          <img src="SCREENSHOT_PATH" />
        </div>
      </div>
    </div>
  </body>
</html>
